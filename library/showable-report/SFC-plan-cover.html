<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>计划书封面 · Standard Financial Charting · SFC</title>
<style>
  :root {
    --ink: #1a1f26;
    --muted: #4a5560;
    --rule: #c5ccd4;
    --paper: #f7f5f0;
    --fill: #ece8e0;
  }
  * { box-sizing: border-box; }
  html { font-size: 11pt; }
  body {
    margin: 0 auto;
    max-width: 180mm;
    min-height: 100vh;
    padding: 16mm 16mm 22mm;
    color: var(--ink);
    background: var(--paper);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC", "Noto Serif SC", serif;
    line-height: 1.45;
  }
  .no-print {
    margin: 0 0 1em;
    font-size: 10pt;
    color: var(--muted);
  }
  .cover {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 0;
    min-height: calc(100vh - 32mm);
    padding: 8mm 0 12mm;
  }
  .cover-logo {
    display: block;
    /* Splash 18×44 step 14; larger mark, still not a wide block. */
    width: 48mm;
    max-width: 38%;
    height: auto;
    margin: 0 0 20mm;
    overflow: visible;
    shape-rendering: geometricPrecision;
  }
  .cover-en {
    margin: 0;
    font-size: 19pt;
    font-weight: 600;
    letter-spacing: 0.04em;
    line-height: 1.35;
  }
  .cover-abbr {
    margin: 1.05em 0 0;
    font-size: 24pt;
    font-weight: 600;
    letter-spacing: 0.08em;
    line-height: 1.2;
  }
  .cover-zh {
    margin: 1.15em 0 0;
    font-size: 15pt;
    font-weight: 600;
    letter-spacing: 0.12em;
    line-height: 1.4;
    color: var(--ink);
  }
  .cover-rule {
    width: 42mm;
    height: 0;
    margin: 12mm auto 8mm;
    border: 0;
    border-top: 1px solid var(--rule);
  }
  .cover-credit {
    margin: 0;
    color: var(--muted);
    font-size: 10.5pt;
    line-height: 1.9;
  }
  .cover-credit div { margin: 0.25em 0; }
  @media print {
    body {
      max-width: none;
      min-height: auto;
      padding: 0;
      background: white;
    }
    .no-print { display: none; }
    .cover {
      min-height: 250mm;
      page-break-after: avoid;
    }
    a { color: inherit; text-decoration: none; }
  }
  @page { size: A4; margin: 14mm 14mm 16mm; }
</style>
</head>
<body>
  <p class="no-print">浏览器打开本页 → 打印 → A4 纵向 → 存 PDF → 关掉页眉网址。</p>

  <main class="cover">
    <svg class="cover-logo" viewBox="6 12 50 50" role="img" aria-label="SFC">
      <!-- Exact splash mark: w=18 h=44 step=14 rx=1.5; paper ink. -->
      <g fill="none" stroke="var(--ink)" stroke-width="1.25" stroke-linejoin="round">
        <rect x="8" y="14" width="18" height="44" rx="1.5" opacity="0.95"/>
        <rect x="22" y="14" width="18" height="44" rx="1.5" opacity="0.55"/>
        <rect x="36" y="14" width="18" height="44" rx="1.5" opacity="0.28"/>
      </g>
    </svg>
    <p class="cover-en">Standard Financial Charting</p>
    <p class="cover-abbr">SFC</p>
    <p class="cover-zh">标准金融制图</p>
    <hr class="cover-rule" />
    <div class="cover-credit">
      <div>队长：隋宇博</div>
      <div>队员：周晖、徐国安</div>
    </div>
  </main>
</body>
</html>
