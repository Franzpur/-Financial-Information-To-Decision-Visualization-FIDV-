<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SFC — Industry gate</title>
<link rel="stylesheet" href="/css/app.css?v=43" />
<link rel="preload" href="/vendor/fonts/jost/Jost-300-Light-caps.woff2" as="font" type="font/woff2" crossorigin />
</head>
<body class="home-body">
  <svg class="sfc-defs" aria-hidden="true" focusable="false">
    <defs>
      <g id="sfc-mark">
        <g class="sfc-frames">
          <rect x="8" y="14" width="18" height="44" rx="1.5" opacity="0.95"/>
          <rect x="22" y="14" width="18" height="44" rx="1.5" opacity="0.55"/>
          <rect x="36" y="14" width="18" height="44" rx="1.5" opacity="0.28"/>
        </g>
        <g transform="translate(72 14) scale(0.338462)">
          <path class="sfc-word" d="M22 0H145V30H35L30 35V45L35 50H123L145 72V108L123 130H0V100H110L115 95V85L110 80H22L0 58V22Z"/>
          <path class="sfc-word" d="M165 0H291V30H195Z M165 30H195V50H288V80H195V130H165Z"/>
          <path class="sfc-facet" d="M165 0V30H195Z"/>
          <path class="sfc-word" d="M338 0H439V30H348L338 40V90L348 100H439L424 130H338L308 100V30Z"/>
          <path class="sfc-facet-dim" d="M439 100V130H424Z"/>
        </g>
        <line class="sfc-rule" x1="8" y1="66" x2="220.6" y2="66"/>
      </g>
      <g id="sfc-lockup">
        <use href="#sfc-mark"/>
        <text class="sfc-fullname" x="8" y="77.5" font-size="9.32" textLength="212.6" lengthAdjust="spacing">STANDARD FINANCIAL CHARTING</text>
      </g>
    </defs>
  </svg>

  <!-- [C-SPLASH] On C-HOME only; hold ~2s then fade ~4s -->
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-mark">
      <svg class="splash-logo" viewBox="0 6 229 80" width="300" height="105" aria-hidden="true"><use href="#sfc-lockup"/></svg>
    </div>
  </div>

  <nav class="home-trail-fixed" id="homeTrail" aria-label="Coordinate path"></nav>

  <main class="home home-pending" id="home" hidden>
    <header class="home-brand">
      <a href="/" class="home-logo-link" aria-label="SFC industry gate">
      <svg class="splash-logo home-logo" viewBox="0 6 229 61" width="130" height="35" aria-hidden="true"><use href="#sfc-mark"/></svg>
      </a>
      <p class="home-lede" id="homeLede">BICS industry coordinates · a level-4 cell opens the company list.</p>
      <div class="home-locate">
        <label class="list-filter-wrap" for="homeLocate">
          <span class="visually-hidden">Search name or ticker</span>
          <input class="list-filter" id="homeLocate" type="search" placeholder="Name or ticker" autocomplete="off" />
        </label>
        <div id="homeLocateResults" class="home-locate-results" hidden>
          <p class="home-locate-empty">No matching company.</p>
        </div>
      </div>
    </header>

    <nav class="home-nations" id="nationList" aria-label="Listing country"></nav>
    <p class="home-total" id="homeTotal"></p>

    <nav class="home-sectors" id="sectorList" aria-label="BICS industry coordinates"></nav>

    <p class="home-note">Class-3 industry coordinates · Equity Hierarchy 2024 · L1–L3 board · L4 → company list</p>
  </main>
  <script type="module" src="/js/home.js?v=46"></script>
</body>
</html>
