<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SFC — Company list</title>
<link rel="stylesheet" href="/css/app.css?v=42" />
</head>
<body class="home-body">
  <nav class="home-trail-fixed" id="listTrail" aria-label="Coordinate path"></nav>
  <main class="home home-drilled home-ready" id="listPage">
    <header class="home-brand">
      <a href="/" class="home-logo-link" aria-label="SFC industry gate">
      <svg class="splash-logo home-logo" viewBox="0 6 229 80" width="200" height="70" aria-hidden="true">
        <g class="sfc-frames">
          <rect x="8" y="14" width="18" height="44" rx="1.5" opacity="0.95"/>
          <rect x="22" y="14" width="18" height="44" rx="1.5" opacity="0.55"/>
          <rect x="36" y="14" width="18" height="44" rx="1.5" opacity="0.28"/>
        </g>
        <g transform="translate(72 14) scale(0.338462)">
          <path class="sfc-word" d="M30 0H145V30H30V50H115L145 80V100L115 130H0V100H115V80H30L0 50V30Z"/>
          <path class="sfc-word" d="M165 0H291V30H195Z M165 30H195V50H288V80H195V130H165Z"/>
          <path class="sfc-facet" d="M165 0V30H195Z"/>
          <path class="sfc-word" d="M338 0H439V30H338V100H439L424 130H338L308 100V30Z"/>
          <path class="sfc-facet-dim" d="M439 100V130H424Z"/>
        </g>
        <line class="sfc-rule" x1="8" y1="66" x2="220.6" y2="66"/>
        <text class="sfc-fullname" x="8" y="77.5" font-size="9.32" textLength="212.6" lengthAdjust="spacing">STANDARD FINANCIAL CHARTING</text>
      </svg>
      </a>
      <p class="home-lede" id="listLede">Level-4 company list.</p>
      <label class="list-filter-wrap" for="listFilter">
        <span class="visually-hidden">Filter companies</span>
        <input class="list-filter" id="listFilter" type="search" placeholder="Filter name or ticker" autocomplete="off" />
      </label>
    </header>

    <nav class="home-nations" id="nationList" aria-label="Listing country"></nav>
    <p class="home-total" id="listTotal"></p>
    <div class="list-tools">
      <button type="button" class="list-sort" id="listSortRev">Revenue</button>
    </div>

    <h1 class="visually-hidden">Company list</h1>
    <div class="list-table" id="listTable" aria-label="Companies in this class"></div>
    <p class="home-note" id="listNote"></p>
  </main>
  <script type="module" src="/js/list.js?v=43"></script>
</body>
</html>
